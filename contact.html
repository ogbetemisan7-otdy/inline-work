<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contact</title>
</head>

<body style="
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    min-height: 100vh;
    color: white;
">

    <!-- Navigation -->
    <nav style="
        background: rgba(0,0,0,0.35);
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    ">

        <ul style="
            list-style: none;
            padding: 0;
            margin: 0;
        ">

            <li style="display:inline-block; margin:0 12px;">
                <a href="home.html" style="
                    color:white;
                    text-decoration:none;
                    font-weight:bold;
                    font-size:16px;
                ">Home</a>
            </li>

            <li style="display:inline-block; margin:0 12px;">
                <a href="about.html" style="
                    color:white;
                    text-decoration:none;
                    font-weight:bold;
                    font-size:16px;
                ">About Me</a>
            </li>

            <li style="display:inline-block; margin:0 12px;">
                <a href="gallery.html" style="
                    color:white;
                    text-decoration:none;
                    font-weight:bold;
                    font-size:16px;
                ">My Photos</a>
            </li>

            <li style="display:inline-block; margin:0 12px;">
                <a href="skill.html" style="
                    color:white;
                    text-decoration:none;
                    font-weight:bold;
                    font-size:16px;
                ">My Skills</a>
            </li>

        </ul>
    </nav>


    <!-- Contact Section -->
    <div style="
        max-width:600px;
        margin:60px auto;
        padding:20px;
    ">

        <div style="
            background:rgba(255,255,255,0.12);
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.2);
        ">

            <h1 style="
                text-align:center;
                font-size:42px;
                margin-bottom:10px;
                color:white;
            ">
                CONTACT ME
            </h1>

            <p style="
                text-align:center;
                color:#dbeafe;
                margin-bottom:35px;
            ">
                I'd love to hear from you. Send me a message below.
            </p>


            <form action="" method="" enctype="multipart/form-data">

                <fieldset style="
                    border:none;
                    padding:0;
                    margin:0;
                ">

                    <!-- Name -->
                    <label for="name" style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:bold;
                    ">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Temisan"
                        style="
                            width:100%;
                            box-sizing:border-box;
                            padding:14px;
                            border:none;
                            border-radius:10px;
                            margin-bottom:20px;
                            font-size:16px;
                            outline:none;
                        "
                    >


                    <!-- Email -->
                    <label for="email" style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:bold;
                    ">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ogbetemisan7@gmail.com"
                        style="
                            width:100%;
                            box-sizing:border-box;
                            padding:14px;
                            border:none;
                            border-radius:10px;
                            margin-bottom:20px;
                            font-size:16px;
                            outline:none;
                        "
                    >


                    <!-- Message -->
                    <label for="message" style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:bold;
                    ">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your message here..."
                        rows="6"
                        style="
                            width:100%;
                            box-sizing:border-box;
                            padding:14px;
                            border:none;
                            border-radius:10px;
                            margin-bottom:20px;
                            font-size:16px;
                            resize:vertical;
                            outline:none;
                        "
                    ></textarea>


                    <!-- Submit Button -->
                    <input
                        type="submit"
                        value="Send Message"
                        style="
                            width:100%;
                            padding:15px;
                            background:#2563eb;
                            color:white;
                            border:none;
                            border-radius:10px;
                            font-size:17px;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >

                </fieldset>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer style="
        text-align:center;
        padding:25px;
        color:#bfdbfe;
    ">
        <p style="margin:0;">
            © 2026 My Personal Website
        </p>
    </footer>

</body>
</html>
